name: Deploy Docs to Root GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy-root-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CodeGraphContext
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material

      - name: Build docs
        working-directory: docs
        run: mkdocs build --clean

      - name: Check external Pages deploy key
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        run: |
          if [ -z "$PAGES_DEPLOY_KEY" ]; then
            echo "::error::ACTIONS_DEPLOY_KEY is not configured. Add a write-enabled SSH deploy key to CodeGraphContext/codegraphcontext.github.io and store its private key as the ACTIONS_DEPLOY_KEY Actions secret in this repository."
            exit 1
          fi

      - name: Deploy to codegraphcontext.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: CodeGraphContext/codegraphcontext.github.io
          publish_dir: docs/site
          publish_branch: main
