[project]
name = "codegraphcontext-fork"
version = "0.7.0"
description = "An MCP server that indexes local code into a graph database to provide context to AI assistants."
authors = [{ name = "Shashank Shekhar Singh", email = "shashankshekharsingh1205@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "watchdog>=3.0.0",
    "stdlibs>=2023.11.18",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "inquirerpy>=0.3.4",
    "python-dotenv>=1.0.0",
    "tree-sitter>=0.24.0,<0.26.0",
    # ------------------------------------------------------------------
    # tree-sitter-language-pack upper bound (Haskell golden regression)
    #
    # 1.21.0 (released 2026-10-04) reshapes the Haskell tree-sitter grammar:
    # `class ... where` and `data ... = ...` declarations stop being
    # surfaced, so the Haskell parser emits **no Class nodes at all**.
    # Evidence, all on the same commit 642c3215f8 with no code change:
    #   2026-10-02 green  -> installed tree-sitter-language-pack 1.20.0
    #   2026-10-06 red    -> installed tree-sitter-language-pack 1.21.0
    # Breaks three suites on every supported Python version (3.12/3.13/3.14):
    #   tests/integration/test_parser_goldens.py::test_language_golden[sample_project_haskell]
    #       Nodes regression mismatch: Missing 39 expected nodes (all Class)
    #   tests/unit/parsers/test_1538_spurious_records.py::test_haskell_curried_application_is_one_call
    #   tests/unit/tools/test_cross_lang_call_resolution_patterns.py::
    #       ...::test_haskell_typeclass_instances_and_constructor_call
    # Keep <1.21.0 until the Haskell extractor is taught the 1.21 node layout.
    # ------------------------------------------------------------------
    "tree-sitter-language-pack>=1.6,<1.21.0",
    "tree-sitter-c-sharp>=0.21.0",
    "pyyaml",
    "nbformat",
    "nbconvert>=7.16.6",
    "pathspec>=0.12.1",
    "requests>=2.28.0",
    "protobuf>=3.20,<3.21",
    # ------------------------------------------------------------------
    # LadybugDB (the maintained Kùzu fork, see issue #852) publishes wheels
    # across the supported platforms and remains the default embedded backend.
    "ladybug>=0.19,<0.20; sys_platform == 'win32' or (sys_platform != 'win32' and python_version >= '3.10')",
    "mcp>=2.2.0,<3",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
parsing = [
    "tree-sitter>=0.24.0,<0.26.0",
    # See the pin note under [project].dependencies.
    "tree-sitter-language-pack>=1.6,<1.21.0",
    "tree-sitter-c-sharp>=0.21.0",
]
# FalkorDB and its embedded sibling ``falkordblite`` co-evolve with
# ``redis-py``: newer FalkorDB releases require redis-py 7, but redis-py >= 6
# breaks the Unix-domain-socket path used by FalkorDB Lite (#1035). Keep this
# known-good Redis range in the backend extras and in ``datasources`` for ingestion.
# Named backend extras let users (and CI) opt into a single, tested driver
# triple instead of inheriting whatever the default install pulls. They
# are independent of the lean default installation.
falkordb-embedded = [
    "falkordblite>=0.7,<0.10; sys_platform != 'win32' and python_version >= '3.12'",
    "falkordb>=1.0,<1.6",
    "redis>=5,<6",
]
falkordb-remote = [
    "falkordb>=1.0,<1.6",
    "redis>=5,<6",
]
kuzu = [
    # KùzuDB was archived upstream on 2025-10-10; 0.11.3 is the final release.
    # Its wheel matrix stops at cp313 for macOS and Windows; only Linux has
    # Python 3.14 wheels. Without this marker pip tries an unsupported sdist.
    "kuzu; python_version < '3.14' or sys_platform == 'linux'",
]
ladybug = [
    "ladybug>=0.19,<0.20; sys_platform == 'win32' or (sys_platform != 'win32' and python_version >= '3.10')",
]
neo4j = [
    "neo4j>=5.15.0",
]
gcf = [
    "gcf-python>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "black>=23.11.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock",
    "ruff",
    # mcp>=2 renamed its vendored httpx to httpx2, so it's no longer pulled
    # in transitively; tests/unit/api/test_mcp_streamable_http.py needs the
    # real package directly.
    "httpx",
    # The test suite exercises each optional graph backend directly.
    "falkordblite>=0.7,<0.10; sys_platform != 'win32' and python_version >= '3.12'",
    "falkordb>=1.0,<1.6",
    "redis>=5,<6",
    "kuzu; python_version < '3.14' or sys_platform == 'linux'",
    "neo4j>=5.15.0",
]
# Optional drivers for `cgc datasource` ingestion (MySQL/Aurora, Cassandra, Redis).
datasources = [
    "pymysql",
    "mysql-connector-python",
    "cassandra-driver",
    "redis>=5,<6",
]

[project.urls]
"Homepage" = "https://github.com/JohnXu22786/CodeGraphContext"
"Bug Tracker" = "https://github.com/JohnXu22786/CodeGraphContext/issues"

[project.scripts]
cgc = "codegraphcontext.cli.main:app"
codegraphcontext = "codegraphcontext.cli.main:app"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
codegraphcontext = ["viz/dist/**/*"]

[tool.setuptools.data-files]
"share/doc/codegraphcontext-fork" = ["CHANGELOG.md", "UPSTREAM.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["codegraphcontext*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures", "tests/e2e/sample_projects", "venv", ".git", "__pycache__"]
markers = [
    "integration: mark a test as an integration test.",
    "e2e: mark a test as an end-to-end test.",
    "slow: mark test as slow."
]
