<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Branch and worktree scoped indexes</title>
  <desc id="desc">Illustrative sample diagram showing three checkouts mapped to separate local graph indexes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172944"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#07101f" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect x="36" y="30" width="1128" height="48" rx="12" fill="#f6c453"/>
  <text x="60" y="61" fill="#30220a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing=".8">ILLUSTRATIVE MOCK  •  SAMPLE DATA</text>
  <text x="58" y="132" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">One repository, separate checkout indexes</text>
  <text x="58" y="168" fill="#a8bbd3" font-family="Inter,Arial,sans-serif" font-size="18">Default per-repository mode keeps branch and worktree graph state apart.</text>
  <path d="M600 278V318M230 318H970M230 318V345M600 318V345M970 318V345" fill="none" stroke="#667c99" stroke-width="3" stroke-dasharray="7 8"/>
  <rect x="420" y="205" width="360" height="74" rx="16" fill="#202f46" stroke="#385173" stroke-width="2"/>
  <circle cx="458" cy="242" r="12" fill="#66d9c5"/>
  <text x="482" y="237" fill="#eff6ff" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">sample-payments</text>
  <text x="482" y="260" fill="#95a9c3" font-family="Inter,Arial,sans-serif" font-size="14">one Git repository</text>
  <g filter="url(#shadow)">
    <rect x="58" y="346" width="344" height="190" rx="18" fill="#1b2940" stroke="#294260" stroke-width="2"/>
    <rect x="428" y="346" width="344" height="190" rx="18" fill="#1b2940" stroke="#294260" stroke-width="2"/>
    <rect x="798" y="346" width="344" height="190" rx="18" fill="#1b2940" stroke="#294260" stroke-width="2"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="82" y="384" fill="#78d9bd" font-size="14" font-weight="700" letter-spacing="1">CHECKOUT A</text>
    <text x="82" y="418" fill="#f4f7fb" font-size="21" font-weight="700">main</text>
    <text x="82" y="452" fill="#a8bbd3" font-size="15">default branch</text>
    <rect x="82" y="477" width="296" height="38" rx="9" fill="#243a54"/>
    <text x="98" y="501" fill="#d7e5f5" font-size="14">.codegraphcontext/db/</text>

    <text x="452" y="384" fill="#91a9ff" font-size="14" font-weight="700" letter-spacing="1">CHECKOUT B</text>
    <text x="452" y="418" fill="#f4f7fb" font-size="21" font-weight="700">feature/tax-rules</text>
    <text x="452" y="452" fill="#a8bbd3" font-size="15">separate branch identity</text>
    <rect x="452" y="477" width="296" height="38" rx="9" fill="#243a54"/>
    <text x="468" y="501" fill="#d7e5f5" font-size="14">db/branches/&lt;identity&gt;/</text>

    <text x="822" y="384" fill="#d2a6ff" font-size="14" font-weight="700" letter-spacing="1">LINKED WORKTREE</text>
    <text x="822" y="418" fill="#f4f7fb" font-size="21" font-weight="700">review checkout</text>
    <text x="822" y="452" fill="#a8bbd3" font-size="15">distinct worktree identity</text>
    <rect x="822" y="477" width="296" height="38" rx="9" fill="#243a54"/>
    <text x="838" y="501" fill="#d7e5f5" font-size="14">db/branches/&lt;identity&gt;/</text>
  </g>
  <text x="58" y="580" fill="#92a5bd" font-family="Inter,Arial,sans-serif" font-size="14">Explicit shared contexts are an opt-out from automatic branch isolation.</text>
</svg>
