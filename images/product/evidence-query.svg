<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Scoped query with evidence and confidence</title>
  <desc id="desc">Illustrative mock result from a fictional repository showing a repository filter, bounded page, source evidence, and an ambiguous relationship.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1a2a43"/></linearGradient></defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect x="36" y="30" width="1128" height="48" rx="12" fill="#f6c453"/>
  <text x="60" y="61" fill="#30220a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing=".8">ILLUSTRATIVE MOCK  •  SAMPLE DATA</text>
  <text x="58" y="132" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">Keep answers tied to inspectable evidence</text>
  <text x="58" y="168" fill="#a8bbd3" font-family="Inter,Arial,sans-serif" font-size="18">Scope the repository, cap output, and show where a relationship is uncertain.</text>
  <rect x="58" y="204" width="1084" height="72" rx="14" fill="#0c1420" stroke="#334965" stroke-width="2"/>
  <text x="82" y="232" fill="#7ca4ff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">MCP TOOL  ·  analyze_code_relationships</text>
  <text x="82" y="256" fill="#dce9f8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">query_type=find_callers  target=charge_card  repo_path=sample-payments  page_size=10</text>
  <rect x="58" y="298" width="1084" height="250" rx="16" fill="#17253a" stroke="#2b4360" stroke-width="2"/>
  <text x="84" y="334" fill="#eff6ff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Result 01  ·  PaymentService.submit</text>
  <rect x="854" y="312" width="242" height="34" rx="17" fill="#12352e"/><text x="875" y="335" fill="#70e0b4" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">EXTRACTED FROM SOURCE</text>
  <text x="84" y="370" fill="#9db2cb" font-family="Inter,Arial,sans-serif" font-size="14">src/payments/service.py  ·  call edge with source location</text>
  <rect x="84" y="390" width="1012" height="54" rx="10" fill="#0c1420"/>
  <text x="104" y="423" fill="#d6e6f6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">submit_order(order)  →  charge_card(order.total)</text>
  <rect x="84" y="462" width="1012" height="58" rx="10" fill="#352c1d" stroke="#6f5729"/>
  <text x="104" y="486" fill="#ffd474" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing=".5">AMBIGUOUS RELATIONSHIP</text>
  <text x="104" y="507" fill="#ead9b4" font-family="Inter,Arial,sans-serif" font-size="14">Two candidate targets remain; inspect candidates before treating this edge as certain.</text>
  <text x="58" y="580" fill="#92a5bd" font-family="Inter,Arial,sans-serif" font-size="14">Fictional repository, symbols, paths, and output; the example is not a product capture.</text>
</svg>
